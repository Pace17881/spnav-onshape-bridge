name: packaging

# Builds the actual distro packages (not just the raw binary) on every push,
# so a packaging regression is caught immediately rather than discovered at
# release time. Both jobs build from the commit under test, not from a
# published tarball/AUR source - see the sed step in each job.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  debian-package:
    runs-on: ubuntu-latest
    container: debian:bookworm
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          apt-get update -qq
          apt-get install -y -qq build-essential devscripts debhelper \
            libspnav-dev libssl-dev libx11-dev python3

      - name: Build .deb
        run: dpkg-buildpackage -us -uc -b

      - name: Show resulting package
        run: |
          dpkg -I ../spnav-onshape-bridge_*.deb
          dpkg -c ../spnav-onshape-bridge_*.deb

      - name: Install and smoke-test
        run: |
          apt-get install -y -qq ../spnav-onshape-bridge_*.deb
          spnav-onshape-bridge --help
          spnav-onshape-bridge --doctor || true

      - name: Move package into the workspace for upload
        # actions/upload-artifact@v4 rejects path patterns containing ".."
        run: mkdir -p dist && mv ../spnav-onshape-bridge_*.deb dist/

      - uses: actions/upload-artifact@v4
        with:
          name: debian-package
          path: dist/spnav-onshape-bridge_*.deb

  arch-package:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      # archlinux:base-devel has no git preinstalled. actions/checkout@v4
      # needs git available *before* it runs, or it silently falls back to
      # a git-less tarball download with no .git directory at all - which
      # then breaks the git+file:// source below ("does not appear to be a
      # git repository"). So install git first, checkout second.
      - name: Install git (needed before checkout)
        run: pacman -Sy --noconfirm --needed git

      - uses: actions/checkout@v4

      - name: Install remaining build dependencies
        run: pacman -Sy --noconfirm --needed libspnav openssl libx11

      - name: Point PKGBUILD at this checkout
        # The real PKGBUILD fetches a specific tagged release from the
        # project's repository; in CI we build the commit under test
        # instead, since a PR branch usually isn't tagged yet, and
        # actions/checkout's default shallow clone doesn't fetch tags at
        # all - so also drop the #tag=v${pkgver} fragment, cloning
        # $GITHUB_WORKSPACE's checked-out HEAD instead of a specific tag.
        run: |
          sed -i "s#\$pkgname::git+https://github.com/Pace17881/spnav-onshape-bridge.git#\$pkgname::git+file://${GITHUB_WORKSPACE}#" \
            packaging/arch/PKGBUILD
          sed -i 's/#tag=[^"]*"/"/' packaging/arch/PKGBUILD

      - name: Build package as non-root (makepkg refuses to run as root)
        run: |
          useradd -m builder
          cp -r packaging/arch /tmp/pkgbuild
          chown -R builder:builder /tmp/pkgbuild "$GITHUB_WORKSPACE"
          chmod -R a+rX "$GITHUB_WORKSPACE"
          # git (>= 2.35.2) refuses to operate across a uid boundary unless
          # told it's safe - builder cloning $GITHUB_WORKSPACE (owned by
          # builder since the chown above, but builder has no gitconfig of
          # its own yet) needs this, system-wide since it's builder's git
          # invocation, not root's.
          git config --system --add safe.directory "*"
          su builder -c 'cd /tmp/pkgbuild && makepkg -s --noconfirm --skippgpcheck'

      - name: Install and smoke-test
        run: |
          pacman -U --noconfirm /tmp/pkgbuild/spnav-onshape-bridge-*.pkg.tar.zst
          spnav-onshape-bridge --help
          spnav-onshape-bridge --doctor || true

      - uses: actions/upload-artifact@v4
        with:
          name: arch-package
          path: /tmp/pkgbuild/spnav-onshape-bridge-*.pkg.tar.zst
